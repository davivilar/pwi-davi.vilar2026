<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Formulário Completo</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1e1e2f, #34345c);
            padding: 30px;
            color: white;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: #2f2f4f;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.4);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #00d4ff;
        }

        form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .campo {
            display: flex;
            flex-direction: column;
        }

        .full {
            grid-column: 1 / 3;
        }

        label {
            margin-bottom: 5px;
            font-weight: bold;
        }

        input,
        textarea,
        select {
            padding: 12px;
            border-radius: 8px;
            border: 2px solid #555;
            background: #444;
            color: white;
            transition: 0.3s;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: #00d4ff;
            outline: none;
        }

        textarea {
            resize: none;
            height: 100px;
        }

        .erro {
            color: #ff6b6b;
            font-size: 12px;
            margin-top: 5px;
        }

        .erro-input {
            border-color: red !important;
        }

        .botoes {
            grid-column: 1 / 3;
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        button {
            padding: 14px 30px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-enviar {
            background: #00c853;
            color: white;
        }

        .btn-enviar:hover {
            background: #00a844;
            transform: scale(1.05);
        }

        .btn-limpar {
            background: #d50000;
            color: white;
        }

        .btn-limpar:hover {
            background: #b00000;
            transform: scale(1.05);
        }

        @media(max-width: 700px) {
            form {
                grid-template-columns: 1fr;
            }

            .full,
            .botoes {
                grid-column: auto;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🚀 Formulário de Cadastro</h1>

        <form id="formulario">

            <!-- Nome -->
            <div class="campo">
                <label for="nome">Nome</label>
                <input type="text" id="nome" name="nome">
            </div>

            <!-- Sobrenome -->
            <div class="campo">
                <label for="sobrenome">Sobrenome</label>
                <input type="text" id="sobrenome" name="sobrenome">
            </div>

            <!-- Idade -->
            <div class="campo">
                <label for="idade">Idade</label>
                <input type="number" id="idade" name="idade">
            </div>

            <!-- Data -->
            <div class="campo">
                <label for="dataNascimento">Data de Nascimento</label>
                <input type="date" id="dataNascimento" name="dataNascimento">
            </div>

            <!-- Endereço -->
            <div class="campo">
                <label for="endereco">Endereço</label>
                <input type="text" id="endereco" name="endereco">
            </div>

            <!-- Número -->
            <div class="campo">
                <label for="numero">Número</label>
                <input type="number" id="numero" name="numero">
            </div>

            <!-- Bairro -->
            <div class="campo">
                <label for="bairro">Bairro</label>
                <input type="text" id="bairro" name="bairro">
            </div>

            <!-- CEP -->
            <div class="campo">
                <label for="cep">CEP</label>
                <input type="text" id="cep" name="cep">
            </div>

            <!-- Telefone -->
            <div class="campo">
                <label for="telefone">Telefone</label>
                <input type="tel" id="telefone" name="telefone">
            </div>

            <!-- Email -->
            <div class="campo">
                <label for="email">Email</label>
                <input type="email" id="email" name="email">
            </div>

            <!-- Cor -->
            <div class="campo">
                <label for="cor">Cor predileta</label>
                <input type="color" id="cor" name="cor">
            </div>

            <!-- Senha -->
            <div class="campo">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha">
            </div>

            <!-- Sexo -->
            <div class="campo">
                <label>Sexo</label>

                <div>
                    <input type="radio" name="sexo" value="Masculino"> Masculino
                </div>

                <div>
                    <input type="radio" name="sexo" value="Feminino"> Feminino
                </div>
            </div>

            <!-- Interesses -->
            <div class="campo">
                <label>Interesses</label>

                <div>
                    <input type="checkbox" name="interesses"> Programação
                </div>

                <div>
                    <input type="checkbox" name="interesses"> Jogos
                </div>

                <div>
                    <input type="checkbox" name="interesses"> Música
                </div>
            </div>

            <!-- Estado -->
            <div class="campo">
                <label for="estado">Estado</label>

                <select id="estado" name="estado">
                    <option value="">Selecione</option>
                    <option>SP</option>
                    <option>RJ</option>
                    <option>MG</option>
                    <option>PR</option>
                </select>
            </div>

            <!-- Observações -->
            <div class="campo full">
                <label for="observacoes">Observações</label>
                <textarea id="observacoes" name="observacoes"></textarea>
            </div>

            <!-- Upload -->
            <div class="campo full">
                <label for="arquivo">Enviar documento</label>
                <input type="file" id="arquivo" name="arquivo">
            </div>

            <!-- Range -->
            <div class="campo full">
                <label for="satisfacao">Nível de satisfação</label>
                <input type="range" id="satisfacao" name="satisfacao">
            </div>

            <!-- Botões -->
            <div class="botoes">
                <button type="submit" class="btn-enviar">Enviar</button>

                <button type="reset" class="btn-limpar">Limpar</button>
            </div>

        </form>

    </div>
    <script src="./JS/validacao.js" defer></script>

</body>

</html>
